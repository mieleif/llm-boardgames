[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toy-battle-bench"
version = "0.1.0"
description = "Digital engine for the 1v1 board game Toy Battle, plus an LLM benchmarking framework (OCR, tool use, game skill)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "llm-boardgames" }]
dependencies = [
    "pillow>=10.0",
]

[project.optional-dependencies]
# LLM provider SDKs are optional: the engine, bots, and benchmark harness run without them.
llm = [
    "anthropic>=0.39",
    "openai>=1.40",
    "google-genai>=0.3",
]
dev = [
    "pytest>=7.4",
]

[project.scripts]
toy-battle = "toy_battle.cli:main"

[tool.setuptools.packages.find]
include = ["toy_battle*"]

[tool.setuptools.package-data]
"toy_battle.boards" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
